<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0c1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <div class="app">

    <section id="track" class="panel"></section>

  <div id="toast" class="toast" role="status"></div>
  <div id="muscle-modal" class="muscle-modal" hidden></div>

  <script src="js/exercises.js?v=atlas12"></script>
